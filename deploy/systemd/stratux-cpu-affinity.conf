# OPTIONAL drop-in for stratux.service. NOT installed by default.
#
# Install to /etc/systemd/system/stratux.service.d/cpu-affinity.conf only if
# `deploy/soak.sh --compare` shows the display costing the radios messages.
#
# Reserves cores 0-2 for Stratux (dump1090 and dump978 together need most of two on a Pi 3) and
# leaves core 3 for the display, which must then also be pinned via CPUAffinity=3 in
# avionics.service. A dropped ADS-B message is worse than a dropped frame, so the radios get the
# larger share.
#
# Do not install this speculatively. Hard-pinning defeats the scheduler's own load balancing, and
# on a 4-core part with interrupt load on core 0 it can easily make things worse. Measure first.
#
# To remove: delete the file and `systemctl daemon-reload && systemctl restart stratux`.

[Service]
CPUAffinity=0-2
